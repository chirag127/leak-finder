[project]
name = "leak-finder"
version = "0.1.0"
description = "Local-first CLI that finds money leaks in Indian bank statements"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["finance", "banking", "india", "pdf", "cli", "money-leaks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "pdfplumber>=0.11.0",
    "pypdf>=5.0.0",
    "pandas>=2.2.0",
    "rich>=13.9.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.4.0", "pytest-cov>=6.0.0"]

[project.scripts]
leak-finder = "leak_finder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["leak_finder"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
